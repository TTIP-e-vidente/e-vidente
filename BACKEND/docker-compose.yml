# LEGACY — no usar en desarrollo diario.
# El proyecto corre 100% contra Supabase (ver docs/SUPABASE_QUICKSTART.md).
# Conservado solo para migración puntual de datos locales viejos.
services:
  postgres:
    image: postgres:16-alpine
    container_name: e-vidente-postgres
    restart: unless-stopped
    env_file:
      - ${POSTGRES_ENV_FILE:-.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - evidente_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evidente_postgres_data:
    name: evidente_postgres_data
