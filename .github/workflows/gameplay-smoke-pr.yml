name: Gameplay Smoke PR
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Manual smoke {0}', github.ref_name) || format('Smoke {0}', github.head_ref) }}"

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: gameplay-smoke-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gameplay-smoke:
    name: Gameplay Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6.2 headless
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.2-stable_linux.x86_64
          sudo mv Godot_v4.6.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get install -y --no-install-recommends libfontconfig1 libgles2

      - name: Gameplay smoke validation
        shell: sh
        run: |
          set -eu
          rm -rf validation-logs/gameplay
          export EVIDENTE_VALIDATION_LOG_DIR="validation-logs/gameplay"
          sh scripts/run-godot-validation.sh --run smoke godot

      - name: Upload validation logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-smoke-logs-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: validation-logs/gameplay
          if-no-files-found: warn
          retention-days: 14
