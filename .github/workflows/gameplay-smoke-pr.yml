name: Gameplay Smoke PR
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Manual smoke {0}', github.ref_name) || format('Smoke {0} -> {1}', github.head_ref, github.base_ref) }}"

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gameplay-smoke-pr-{0}', github.event.pull_request.number) || format('gameplay-smoke-manual-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gameplay-smoke:
    name: Gameplay Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.6.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1
          rm -rf /var/lib/apt/lists/*

      - name: Gameplay smoke validation
        shell: bash
        env:
          EVIDENTE_VALIDATION_LOG_DIR: ${{ github.workspace }}/validation-logs/gameplay
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/validation-logs/gameplay"
          sh scripts/run-godot-validation.sh --run smoke godot

      - name: Upload gameplay logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-smoke-logs-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: validation-logs/gameplay
          if-no-files-found: warn
          retention-days: 14