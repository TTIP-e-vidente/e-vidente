name: CI Shared Core (internal)

on:
  workflow_call:
    inputs:
      validation_context:
        required: true
        type: string
      pull_request_base_ref:
        required: false
        type: string
        default: ""

jobs:
  docs:
    name: Docs / Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Docs: Baseline"
        shell: bash
        run: |
          set -euo pipefail
          if sh scripts/ci/check-docs-guardrails.sh; then
            exit 0
          fi

          echo "::warning::Docs / Wiki quedo fuera del gate obligatorio. Revisar README/wiki por separado."

      - name: "Docs: Fetch PR base branch"
        if: inputs.validation_context == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ inputs.pull_request_base_ref }}:refs/remotes/origin/${{ inputs.pull_request_base_ref }}"

      - name: "Docs: PR wiki sync reminder"
        if: inputs.validation_context == 'pull_request'
        shell: bash
        env:
          EVIDENTE_VALIDATION_CONTEXT: ${{ inputs.validation_context }}
          EVIDENTE_PR_BASE_REF: ${{ inputs.pull_request_base_ref }}
        run: |
          set -euo pipefail
          if sh scripts/ci/check-pr-wiki-sync.sh; then
            exit 0
          fi

          echo "::warning::El recordatorio de wiki no bloquea el gate jugable. Revisar trazabilidad documental por separado."

  codebase:
    name: Codebase / Structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Codebase: Repository baseline"
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/ci/check-codebase-guardrails.sh

  gameplay:
    name: Gameplay Smoke
    needs: codebase
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.6.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Gameplay: Install Linux runtime libraries"
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1
          rm -rf /var/lib/apt/lists/*

      - name: "Gameplay: Core validation"
        shell: bash
        env:
          EVIDENTE_VALIDATION_LOG_DIR: ${{ github.workspace }}/validation-logs/gameplay
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/validation-logs/gameplay"

          sh scripts/run-godot-validation.sh --run ci godot

      - name: "Gameplay: Upload logs artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-smoke-logs-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: validation-logs/gameplay
          if-no-files-found: warn
          retention-days: 14
