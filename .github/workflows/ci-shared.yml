name: CI Shared Core (internal)

on:
  workflow_call:

jobs:
  quality:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Guardrails: Repository baseline"
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/ci/check-repo-guardrails.sh

  validate:
    name: Core Validation
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.6.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Validation: Install Linux runtime libraries"
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1
          rm -rf /var/lib/apt/lists/*

      - name: "Validation: Run core Godot suite"
        shell: bash
        env:
          EVIDENTE_VALIDATION_LOG_DIR: ${{ github.workspace }}/validation-logs
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/validation-logs"

          sh scripts/run-godot-validation.sh --run ci godot

      - name: "Validation: Upload logs artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-validation-logs-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: validation-logs
          if-no-files-found: warn
          retention-days: 14
