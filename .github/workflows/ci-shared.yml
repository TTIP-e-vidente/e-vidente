name: CI Shared Core (internal)

on:
  workflow_call:

jobs:
  docs:
    name: Docs / Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Docs: Baseline"
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/ci/check-docs-guardrails.sh

  codebase:
    name: Codebase / Structure
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.6.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Codebase: Install Linux runtime libraries"
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1
          rm -rf /var/lib/apt/lists/*

      - name: "Codebase: Repository baseline"
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/ci/check-codebase-guardrails.sh

      - name: "Codebase: Headless load"
        shell: bash
        env:
          EVIDENTE_VALIDATION_LOG_DIR: ${{ github.workspace }}/validation-logs/codebase
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/validation-logs/codebase"

          sh scripts/run-godot-validation.sh --run codebase godot

      - name: "Codebase: Upload logs artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebase-validation-logs-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: validation-logs/codebase
          if-no-files-found: warn
          retention-days: 14

  gameplay:
    name: Gameplay Smoke
    needs: codebase
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.6.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Gameplay: Install Linux runtime libraries"
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1
          rm -rf /var/lib/apt/lists/*

      - name: "Gameplay: Smoke test"
        shell: bash
        env:
          EVIDENTE_VALIDATION_LOG_DIR: ${{ github.workspace }}/validation-logs/gameplay
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/validation-logs/gameplay"

          sh scripts/run-godot-validation.sh --run smoke godot

      - name: "Gameplay: Upload logs artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-smoke-logs-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: validation-logs/gameplay
          if-no-files-found: warn
          retention-days: 14
