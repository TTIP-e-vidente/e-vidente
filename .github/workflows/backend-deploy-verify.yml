# Verificación post-deploy — Supabase Edge + pg_cron (staging/prod).
# Ejecutar manualmente después de migrate + deploy Edge + setup cron.

name: Supabase deploy verify

on:
  workflow_dispatch:
    inputs:
      supabase_project_ref:
        description: Project ref (ej. kpvjdzdynqfhqfiatwqz)
        required: true
        type: string
      run_full_verify:
        description: Correr verify:integration:full (requiere secrets de staging en repo)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-edge:
    name: Verify Supabase Edge deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Edge auth-health smoke
        env:
          REF: ${{ inputs.supabase_project_ref }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          URL="https://${REF}.supabase.co/functions/v1/auth-health"
          echo "GET ${URL}"
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            CODE=$(curl -sS -o body.json -w "%{http_code}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              "${URL}")
            cat body.json
            echo ""
            test "$CODE" = "200"
          else
            CODE=$(curl -sS -o body.json -w "%{http_code}" "${URL}")
            cat body.json
            echo ""
            echo "Sin STAGING_SUPABASE_ANON_KEY — esperado 401 sin key"
            test "$CODE" = "401" -o "$CODE" = "200"
          fi

      - name: Setup Node
        if: inputs.run_full_verify
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Full integration verify
        if: inputs.run_full_verify
        working-directory: BACKEND
        env:
          POSTGRES_HOST: ${{ secrets.STAGING_POSTGRES_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER }}
          POSTGRES_PORT: ${{ secrets.STAGING_POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.STAGING_POSTGRES_DB }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          EMAIL_CRON_SECRET: ${{ secrets.EMAIL_CRON_SECRET }}
        run: |
          set -euo pipefail
          npm ci
          sh ../scripts/ci/write-staging-env.sh
          npm run verify:integration:full

      - name: Summary
        if: always() && env.GITHUB_STEP_SUMMARY != ''
        run: |
          {
            echo "### Supabase deploy verify"
            echo "- Project ref: \`${{ inputs.supabase_project_ref }}\`"
            echo "- Edge: \`https://${{ inputs.supabase_project_ref }}.supabase.co/functions/v1\`"
            echo "- Full verify: \`${{ inputs.run_full_verify }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
