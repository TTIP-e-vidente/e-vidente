name: Technical Health
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Manual technical {0}', github.ref_name) || format('Technical {0}', github.ref_name) }}"

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: technical-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  technical-health:
    name: Technical Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.6.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node when package.json exists
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1
          rm -rf /var/lib/apt/lists/*

      - name: Structure and optional lint guardrails
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/ci/check-codebase-guardrails.sh

      - name: Headless import health check
        shell: bash
        env:
          EVIDENTE_VALIDATION_LOG_DIR: ${{ github.workspace }}/validation-logs/technical
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/validation-logs/technical"
          sh scripts/run-godot-validation.sh --run technical godot

      - name: Upload technical logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-health-logs-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: validation-logs/technical
          if-no-files-found: warn
          retention-days: 14