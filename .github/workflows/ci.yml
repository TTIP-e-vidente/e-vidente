name: CI
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Manual {0}', github.ref_name) || format('Commit {0}', github.ref_name) }}"

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-validation:
    name: Commit
    uses: ./.github/workflows/ci-shared.yml
    with:
      validation_context: push