name: Technical Health
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Manual technical {0}', github.ref_name) || format('Technical {0}', github.ref_name) }}"

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: technical-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  technical-health:
    name: Technical Health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node when package.json exists
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Structure and optional lint guardrails
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/ci/check-codebase-guardrails.sh