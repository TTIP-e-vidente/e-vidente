name: Technical Health
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Manual technical {0}', github.ref_name) || format('Technical {0}', github.ref_name) }}"

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: technical-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structure:
    name: Structure
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check critical directories and files
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/ci/check-structure-guardrails.sh

      - name: Check monorepo infrastructure
        shell: pwsh
        run: |
          ./scripts/ci/check-monorepo-infra.ps1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node when package.json exists
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run ESLint if configured
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/ci/check-lint-guardrails.sh

      - name: Check Edge email templates sync
        if: hashFiles('BACKEND/package.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          node BACKEND/scripts/check-email-templates-edge.cjs
