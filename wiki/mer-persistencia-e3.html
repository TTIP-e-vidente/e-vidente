#wrap { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

.fc {

  width: 24px; height: 24px; border-radius: 4px; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: color .15s, background .15s;
}
.fc:hover { color: #fff; background: rgba(255,255,255,0.08); }
#zl { font-size: 10px; color: rgba(255,255,255,0.3); min-width: 32px; text-align: center; font-variant-numeric: tabular-nums; }

  <button class="fc" id="btn-out">−</button>
  <span id="zl">60%</span>

  <button class="fc" id="btn-fit">⊡</button>

<div class="tip">scroll → zoom &nbsp;·&nbsp; drag → mover</div>

<script>
const SVG_W = 1980, SVG_H = 840;
let scale = 0.6, ox = 0, oy = 0, panning = false, lx = 0, ly = 0;

const cv   = document.getElementById('cv');
const wrap = document.getElementById('wrap');
const zl   = document.getElementById('zl');

function render() {
  wrap.style.transform = `translate(${ox|0}px,${oy|0}px) scale(${scale})`;
  zl.textContent = Math.round(scale * 100) + '%';
}

function zoomAt(cx, cy, factor) {
  const ns = Math.max(0.15, Math.min(6, scale * factor));
  const r  = ns / scale;
  ox = cx - r * (cx - ox);
  oy = cy - r * (cy - oy);
  scale = ns;
  render();
}

function fitView() {
  const cw = cv.clientWidth, ch = cv.clientHeight;
  scale = Math.min((cw - 40) / SVG_W, (ch - 40) / SVG_H, 1);
  ox = (cw - SVG_W * scale) / 2;
  oy = Math.max(6, (ch - SVG_H * scale) / 2);
  render();
}

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // Normalize across deltaMode (pixel / line / page)
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16;
  if (e.deltaMode === 2) dy *= 320;

  // Clamp to ±150px, then apply 10% per 100px (multiplicative)
  const clamped = Math.max(-150, Math.min(150, dy));
  const pct    = Math.abs(clamped) / 100 * 0.10;
  const factor = clamped < 0 ? (1 + pct) : 1 / (1 + pct);

  zoomAt(mx, my, factor);
}, { passive: false });

cv.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  panning = true; lx = e.clientX; ly = e.clientY;
  cv.classList.add('drag');
});
window.addEventListener('mousemove', e => {
  if (!panning) return;
  ox += e.clientX - lx; oy += e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  render();
});
window.addEventListener('mouseup', () => { panning = false; cv.classList.remove('drag'); });

document.getElementById('btn-in') .onclick = () => zoomAt(cv.clientWidth/2, cv.clientHeight/2, 1.18);
document.getElementById('btn-out').onclick = () => zoomAt(cv.clientWidth/2, cv.clientHeight/2, 1/1.18);
document.getElementById('btn-fit').onclick = fitView;

fitView();
</script>
