<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MER — E-VIDENTE</title>
    <style>
        @font-face {
            font-family: 'Rubik';
            src: url('../../../project/fonts/Rubik-VariableFont_wght.ttf') format('truetype');
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; font-family: 'Rubik', sans-serif; overflow: hidden; height: 100vh; }

        #canvas {
            width: 100vw; height: 100vh;
            position: relative; overflow: hidden;
            cursor: grab;
        }
        #canvas.panning { cursor: grabbing; }
        #wrapper { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

        .entity-bg { transition: filter 0.2s ease; }
        .entity:hover .entity-bg { filter: brightness(1.14) drop-shadow(0 0 10px rgba(255,255,255,0.18)); }
        text { user-select: none; font-family: 'Rubik', sans-serif; }

        .conn { stroke: rgba(180,195,235,0.25); stroke-width: 2; fill: none; stroke-linecap: round; }
        .label { font-size: 10px; font-weight: 500; fill: rgba(200,215,245,0.55); }
        .card  { font-size: 9px;  font-weight: 700; fill: rgba(200,215,245,0.80); letter-spacing: 0.4px; }

        /* ─── Overlay UI ─── */
        .ov { position: fixed; z-index: 100; }

        .title { top: 22px; left: 26px; }
        .title h1 { color: #fff; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
        .title p  { color: rgba(255,255,255,0.3); font-size: 10px; font-weight: 500;
                    letter-spacing: 1.8px; text-transform: uppercase; margin-top: 4px; }

        .legend {
            top: 22px; right: 26px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px; padding: 12px 16px;
            display: flex; flex-direction: column; gap: 9px;
            backdrop-filter: blur(10px);
        }
        .leg-row { display: flex; align-items: center; gap: 9px; }
        .leg-dot  { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
        .leg-lbl  { color: rgba(255,255,255,0.45); font-size: 10px; font-weight: 500; }

        .controls {
            bottom: 22px; right: 26px;
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09);

            backdrop-filter: blur(12px);

        .btn {
            background: rgba(255,255,255,0.07);

            color: rgba(255,255,255,0.7);
            width: 30px; height: 30px; border-radius: 6px;
            cursor: pointer; font-size: 16px;

        .zoom-val { color: rgba(255,255,255,0.4); font-size: 10px; font-weight: 600;

<!-- Legend -->

  <div class="leg-row"><div class="leg-dot" style="background:#6B8BFF"></div><span class="leg-lbl">Jugador / Perfil</span></div>
  <div class="leg-row"><div class="leg-dot" style="background:#56CE84"></div><span class="leg-lbl">Recorrido / Juego</span></div>

</div>

<!-- Zoom controls -->
<div class="ov controls">
  <button class="btn" id="btn-out">−</button>
  <span class="zoom-val" id="zoom-val">100%</span>
  <button class="btn" id="btn-in">+</button>
  <button class="btn" id="btn-reset" title="Resetear">↺</button>
</div>

<!-- Hint -->
<div class="ov hint">Rueda del mouse para zoom &nbsp;·&nbsp; Arrastrá para mover</div>

<script>
  let scale = 1, ox = 0, oy = 0, panning = false, lx = 0, ly = 0;
  const canvas  = document.getElementById('canvas');
  const wrapper = document.getElementById('wrapper');
  const zv      = document.getElementById('zoom-val');

  function draw() {
    wrapper.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
    zv.textContent = Math.round(scale * 100) + '%';
  }

  function zoomTo(x, y, d) {
    const ns = Math.max(0.25, Math.min(4, scale + d));
    const r = ns / scale;
    ox = x - r * (x - ox);
    oy = y - r * (y - oy);
    scale = ns;
    draw();
  }

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    zoomTo(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 0.1 : -0.1);
  }, { passive: false });

  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    panning = true; lx = e.clientX; ly = e.clientY;
    canvas.classList.add('panning');
  });
  window.addEventListener('mousemove', e => {
    if (!panning) return;
    ox += e.clientX - lx; oy += e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    draw();
  });
  window.addEventListener('mouseup', () => { panning = false; canvas.classList.remove('panning'); });

  document.getElementById('btn-in').onclick  = () => zoomTo(canvas.clientWidth/2, canvas.clientHeight/2,  0.15);
  document.getElementById('btn-out').onclick = () => zoomTo(canvas.clientWidth/2, canvas.clientHeight/2, -0.15);
  document.getElementById('btn-reset').onclick = () => { scale = 1; ox = 0; oy = 0; draw(); };

  draw();
</script>
</body>
