<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MER Interactivo — E-VIDENTE</title>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <style>
    /* ====================== VARIABLES ====================== */
    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1e2631;
      --border:    #30363d;
      --text:      #e6edf3;
      --text-muted:#7d8590;
      --accent:    #818cf8;
      --radius:    8px;
      --c-perfil:    #a78bfa;
      --c-recorrido: #38bdf8;
      --c-partida:   #34d399;
      --c-modalidad: #fbbf24;
      --c-elemento:  #f87171;
      --c-perfil-bg:    #a78bfa18;
      --c-recorrido-bg: #38bdf818;
      --c-partida-bg:   #34d39918;
      --c-modalidad-bg: #fbbf2418;
      --c-elemento-bg:  #f8717118;
    }
    [data-theme="light"] {
      --bg:        #f0f4f8;
      --surface:   #ffffff;
      --surface2:  #f1f5f9;
      --border:    #dde3ec;
      --text:      #0d1117;
      --text-muted:#64748b;
      --accent:    #4f46e5;
    }

    /* ====================== RESET ====================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background .3s, color .3s;
    }

    /* ====================== HEADER ====================== */
    header {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: .65rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      position: relative;
      z-index: 20;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--c-perfil), var(--c-recorrido), var(--c-partida), var(--c-modalidad), var(--c-elemento));
      opacity: .7;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .header-logo {
      font-size: 1.4rem;
      line-height: 1;
    }
    .header-text h1 {
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: -.02em;
      background: linear-gradient(135deg, var(--accent) 0%, var(--c-recorrido) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-text p {
      font-size: .68rem;
      color: var(--text-muted);
      margin-top: .05rem;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: .4rem;
      flex-wrap: wrap;
    }

    /* ====================== BUTTONS ====================== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .3rem .65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: .74rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
    }
    .btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .btn-sq { padding: .3rem .45rem; }

    /* ====================== SEARCH ====================== */
    .search-wrap { position: relative; }
    .search-icon {
      position: absolute;
      left: .55rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: .8rem;
      pointer-events: none;
    }
    #search-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .3rem .65rem .3rem 1.8rem;
      border-radius: 6px;
      font-size: .74rem;
      width: 170px;
      outline: none;
      transition: border-color .15s, width .2s;
    }
    #search-input:focus { border-color: var(--accent); width: 210px; }
    #search-input::placeholder { color: var(--text-muted); }

    /* ====================== FILTER BAR ====================== */
    .filter-bar {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: .4rem 1.25rem;
      display: flex;
      align-items: center;
      gap: .45rem;
      overflow-x: auto;
      z-index: 19;
    }
    .filter-bar::-webkit-scrollbar { height: 3px; }
    .filter-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .filter-label {
      font-size: .68rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
      margin-right: .1rem;
    }
    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: .28rem;
      padding: .2rem .55rem;
      border-radius: 999px;
      border: 1.5px solid;
      font-size: .7rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, box-shadow .15s;
      white-space: nowrap;
      user-select: none;
    }
    .filter-pill:hover { box-shadow: 0 0 6px currentColor; }
    .filter-pill.off { opacity: .28; }
    .filter-pill .pill-count {
      background: rgba(255,255,255,.15);
      border-radius: 999px;
      padding: 0 .35rem;
      font-size: .63rem;
    }
    .filter-sep {
      width: 1px;
      height: 16px;
      background: var(--border);
      margin: 0 .2rem;
      flex-shrink: 0;
    }
    .stats-chip {
      font-size: .67rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .stats-chip strong { color: var(--text); }

    /* ====================== WORKSPACE ====================== */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    #cy {
      flex: 1;
      height: 100%;
    }

    /* ====================== DETAIL PANEL ====================== */
    #detail-panel {
      width: 0;
      overflow: hidden;
      background: var(--surface);
      border-left: 1px solid var(--border);
      transition: width .3s cubic-bezier(.4,0,.2,1);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
    }
    #detail-panel.open { width: 310px; }
    #detail-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--panel-accent, var(--accent));
      z-index: 1;
      transition: background .2s;
    }
    .detail-inner {
      width: 310px;
      padding: 1rem;
      overflow-y: auto;
      height: 100%;
    }
    .detail-inner::-webkit-scrollbar { width: 4px; }
    .detail-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* detail header */
    .detail-head {
      display: flex;
      align-items: flex-start;
      gap: .6rem;
      margin-bottom: .85rem;
      position: relative;
      padding-right: 1.6rem;
    }
    .detail-emo { font-size: 2rem; line-height: 1; flex-shrink: 0; margin-top: .1rem; }
    .detail-meta h2 {
      font-size: .88rem;
      font-weight: 800;
      word-break: break-all;
      letter-spacing: -.01em;
    }
    .detail-badges { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .3rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .2rem;
      font-size: .65rem;
      font-weight: 700;
      padding: .1rem .45rem;
      border-radius: 999px;
    }
    .badge-group { border: 1.5px solid; }
    .badge-ok   { background: #052e16; color: #4ade80; }
    .badge-partial { background: #451a03; color: #fcd34d; }
    [data-theme="light"] .badge-ok     { background: #dcfce7; color: #166534; }
    [data-theme="light"] .badge-partial { background: #fffbeb; color: #92400e; }

    .detail-close-btn {
      position: absolute;
      top: 0; right: 0;
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      font-size: .7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
    }
    .detail-close-btn:hover { background: var(--border); color: var(--text); }

    /* detail sections */
    .detail-section { margin-bottom: .85rem; }
    .detail-section-title {
      font-size: .63rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      margin-bottom: .4rem;
      display: flex;
      align-items: center;
      gap: .3rem;
    }
    .detail-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* fields table */
    .fields-list { width: 100%; font-size: .78rem; border-collapse: collapse; }
    .fields-list tr { border-bottom: 1px solid var(--border); }
    .fields-list tr:last-child { border: none; }
    .fields-list td { padding: .25rem 0; vertical-align: middle; }
    .fields-list td:first-child {
      color: var(--text-muted);
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: .68rem;
      width: 52px;
    }
    .fields-list td:last-child { font-weight: 600; }

    /* relation chips */
    .rel-list { display: flex; flex-direction: column; gap: .3rem; }
    .rel-chip {
      display: flex;
      align-items: center;
      gap: .4rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .3rem .5rem;
      font-size: .74rem;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .rel-chip:hover { border-color: var(--panel-accent, var(--accent)); background: var(--bg); }
    .rel-chip-emo { font-size: 1rem; flex-shrink: 0; }
    .rel-chip-body { flex: 1; min-width: 0; }
    .rel-chip-name { font-weight: 700; font-size: .73rem; }
    .rel-chip-label { color: var(--text-muted); font-style: italic; font-size: .67rem; margin-top: .05rem; }
    .rel-chip-card {
      font-family: monospace;
      font-size: .65rem;
      color: var(--text-muted);
      background: var(--border);
      padding: .05rem .3rem;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .rel-arrow { color: var(--text-muted); font-size: .8rem; flex-shrink: 0; }

    /* ====================== FLOAT CONTROLS ====================== */
    .float-controls {
      position: absolute;
      bottom: 1.25rem;
      left: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .35rem;
      z-index: 10;
    }
    .float-controls .btn {
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }

    /* ====================== LEGEND ====================== */
    #float-legend {
      position: absolute;
      bottom: 1.25rem;
      right: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .6rem .8rem;
      z-index: 10;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
      transition: right .3s cubic-bezier(.4,0,.2,1);
    }
    #float-legend.shifted { right: 322px; }
    .legend-title {
      font-size: .6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      margin-bottom: .35rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .7rem;
      margin-bottom: .18rem;
    }
    .legend-dot {
      width: 9px; height: 9px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ====================== KEYBOARD HINT ====================== */
    .kbd-hint {
      position: absolute;
      top: .6rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: .65rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: .18rem .65rem;
      border-radius: 999px;
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
    }
    kbd {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0 .28rem;
      font-family: monospace;
      font-size: .6rem;
    }

    /* ====================== LOADING ====================== */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      flex-direction: column;
      gap: 1rem;
      transition: opacity .5s;
    }
    #loading.fade { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: .8rem; color: var(--text-muted); }

    /* ====================== TOOLTIP ====================== */
    #tooltip {
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .35rem .6rem;
      font-size: .72rem;
      color: var(--text);
      pointer-events: none;
      z-index: 998;
      opacity: 0;
      transition: opacity .12s;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
      max-width: 200px;
    }
    #tooltip.show { opacity: 1; }

    /* ====================== SCROLLBAR ====================== */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 600px) {
      #detail-panel.open {
        width: 100%;
        position: absolute;
        right: 0; top: 0; bottom: 0;
        z-index: 30;
      }
      #float-legend { display: none; }
      .kbd-hint { display: none; }
      .stats-chip { display: none; }
    }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <p>Armando el grafo...</p>
</div>

<!-- TOOLTIP -->
<div id="tooltip"></div>

<!-- HEADER -->
<header>
  <div class="header-brand">
    <div class="header-logo">🧠</div>
    <div class="header-text">
      <h1>MER Interactivo — E-VIDENTE</h1>
      <p>Vista auxiliar · Fuente canónica: <a href="../Modelo-Entidad-Relacion.md" style="color:var(--text-muted)">Modelo-Entidad-Relacion.md</a></p>
    </div>
  </div>
  <div class="header-actions">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search-input" type="text" placeholder="Buscar entidad…" autocomplete="off" spellcheck="false"/>
    </div>
    <button class="btn" id="layout-btn" onclick="cycleLayout()" title="Cambiar disposición">⚙ Layout</button>
    <button class="btn" onclick="exportPNG()" title="Exportar como imagen">⬇ PNG</button>
    <button class="btn" id="theme-btn" onclick="toggleTheme()" title="Cambiar tema">☀️</button>
  </div>
</header>

<!-- FILTER BAR -->
<div class="filter-bar" id="filter-bar">
  <span class="filter-label">Grupos</span>
  <!-- pills injected by JS -->
  <div class="filter-sep"></div>
  <span class="stats-chip" id="stats-chip"></span>
</div>

<!-- WORKSPACE -->
<div class="workspace">
  <div id="cy"></div>

  <!-- DETAIL PANEL -->
  <div id="detail-panel">
    <div class="detail-inner" id="detail-inner"></div>
  </div>

  <!-- FLOAT CONTROLS -->
  <div class="float-controls">
    <button class="btn btn-sq" onclick="cy.zoom(cy.zoom()*1.25)" title="Acercar (+)">＋</button>
    <button class="btn btn-sq" onclick="cy.zoom(cy.zoom()*0.8)" title="Alejar (-)">－</button>
    <button class="btn btn-sq" onclick="cy.fit(70)" title="Ajustar todo (F)">⊡</button>
    <button class="btn btn-sq" onclick="runLayout(true)" title="Re-disposición (R)">↺</button>
  </div>

  <!-- LEGEND -->
  <div id="float-legend"></div>

  <!-- KBD HINT -->
  <div class="kbd-hint">
    <kbd>Esc</kbd> cerrar · <kbd>F</kbd> ajustar · <kbd>R</kbd> re-layout · <kbd>click</kbd> explorar
  </div>
</div>

<script>
// =====================================================================
// DATA
// =====================================================================
const GROUPS = {
  perfil:    { label:'Perfil',    color:'#a78bfa', bg:'#a78bfa18', emoji:'👤' },
  recorrido: { label:'Recorrido', color:'#38bdf8', bg:'#38bdf818', emoji:'🗺️' },
  partida:   { label:'Partida',   color:'#34d399', bg:'#34d39918', emoji:'🎮' },
  modalidad: { label:'Modalidad', color:'#fbbf24', bg:'#fbbf2418', emoji:'🧩' },
  elemento:  { label:'Elemento',  color:'#f87171', bg:'#f8717118', emoji:'🎯' },
};

const ENTITIES = {
  // ── CONFIRMADO POR CÓDIGO VERIFICADO ─────────────────────────────
  RECORRIDO:             { g:'recorrido', s:'ok',      e:'🗺️', f:[['string','clave'],['string','nombre'],['string','condicion_base']] },
  CAPITULO:              { g:'recorrido', s:'ok',      e:'📖', f:[['int','indice'],['string','categoria'],['bool','completado']] },
  DESAFIO_ARRASTRE:      { g:'modalidad', s:'ok',      e:'✋', f:[['int','cantidadPositivos'],['int','cantidadNegativos'],['string','categoria']] },
  ITEM_ARRASTRABLE:      { g:'elemento',  s:'ok',      e:'🍎', f:[['string','condiciones'],['bool','esPositivo'],['string','categoria'],['string','sprite']] },
  CONDICION_DIETETICA:   { g:'elemento',  s:'ok',      e:'🏷️', f:[['enum','KETO'],['enum','CELIACO'],['enum','VEGANO'],['enum','DIABETICO'],['enum','VEGETARIANO']] },
  ENSENANZA:             { g:'recorrido', s:'ok',      e:'📚', f:[['string','clave'],['string','contenido_imagen']] },
  // ── FALTA CONFIRMAR (Bitácora/wiki, archivos no encontrados) ──────
  JUGADOR:               { g:'perfil',    s:'partial', e:'👤', f:[['string','nombre'],['string','avatar']] },
  PERFIL_LOCAL:          { g:'perfil',    s:'partial', e:'💾', f:[['string','id'],['date','ultima_actualizacion']] },
  PROGRESO:              { g:'perfil',    s:'partial', e:'📊', f:[['string','recorrido_actual'],['int','nodos_completados'],['string','ultimo_nodo']] },
  RACHA:                 { g:'perfil',    s:'partial', e:'🔥', f:[['int','dias_consecutivos'],['date','ultima_fecha_jugada']] },
  PARTIDA_GUARDADA:      { g:'perfil',    s:'partial', e:'📌', f:[['string','recorrido_clave'],['string','nodo_clave'],['string','juego_actual'],['date','fecha_guardado']] },
  MAPA:                  { g:'recorrido', s:'partial', e:'🧭', f:[['string','id'],['string','recorrido_clave'],['string','titulo']] },
  NODO_JUGABLE:          { g:'recorrido', s:'partial', e:'🎯', f:[['string','node_key'],['string','titulo'],['string','estado'],['string','ruta_json']] },
  PARTIDA_DE_NODO:       { g:'partida',   s:'partial', e:'🎮', f:[['string','node_key'],['int','indice_juego_actual'],['string','estado']] },
  JUEGO_INTERNO:         { g:'partida',   s:'partial', e:'🧩', f:[['string','modalidad'],['int','orden'],['string','content_path']] },
  PREGUNTA:              { g:'modalidad', s:'partial', e:'❓', f:[['string','enunciado'],['string','respuesta_correcta'],['string','opciones']] },
  VINCULACION_CONCEPTOS: { g:'modalidad', s:'partial', e:'🔗', f:[['string','consigna'],['string','pares_validos']] },
};

const RELATIONS = [
  // ── CONFIRMADO POR CÓDIGO VERIFICADO ─────────────────────────────
  { src:'RECORRIDO',        tgt:'CAPITULO',              lbl:'contiene',          card:'1:N'    },
  { src:'CAPITULO',         tgt:'DESAFIO_ARRASTRE',      lbl:'ejecuta',           card:'1:1'    },
  { src:'DESAFIO_ARRASTRE', tgt:'ITEM_ARRASTRABLE',      lbl:'utiliza',           card:'1:N'    },
  { src:'ITEM_ARRASTRABLE', tgt:'CONDICION_DIETETICA',   lbl:'valida_con',        card:'N:N'    },
  { src:'CAPITULO',         tgt:'ENSENANZA',             lbl:'muestra_al_completar', card:'1:0..1' },
  // ── FALTA CONFIRMAR (Bitácora/wiki, archivos no encontrados) ──────
  { src:'JUGADOR',          tgt:'PERFIL_LOCAL',          lbl:'posee',             card:'1:1'    },
  { src:'PERFIL_LOCAL',     tgt:'PROGRESO',              lbl:'conserva',          card:'1:1'    },
  { src:'PERFIL_LOCAL',     tgt:'RACHA',                 lbl:'registra',          card:'1:1'    },
  { src:'PERFIL_LOCAL',     tgt:'PARTIDA_GUARDADA',      lbl:'permite_retomar',   card:'1:0..1' },
  { src:'RECORRIDO',        tgt:'MAPA',                  lbl:'organiza_en',       card:'1:0..1' },
  { src:'MAPA',             tgt:'NODO_JUGABLE',          lbl:'contiene',          card:'1:N'    },
  { src:'NODO_JUGABLE',     tgt:'PARTIDA_DE_NODO',       lbl:'inicia',            card:'1:0..1' },
  { src:'PARTIDA_DE_NODO',  tgt:'JUEGO_INTERNO',         lbl:'contiene',          card:'1:N'    },
  { src:'JUEGO_INTERNO',    tgt:'PREGUNTA',              lbl:'puede_ser',         card:'1:0..1' },
  { src:'JUEGO_INTERNO',    tgt:'DESAFIO_ARRASTRE',      lbl:'puede_ser',         card:'1:0..1' },
  { src:'JUEGO_INTERNO',    tgt:'VINCULACION_CONCEPTOS', lbl:'puede_ser',         card:'1:0..1' },
  { src:'PROGRESO',         tgt:'RECORRIDO',             lbl:'registra_avance_en',card:'1:N'    },
  { src:'PROGRESO',         tgt:'NODO_JUGABLE',          lbl:'marca_estado_de',   card:'1:N'    },
];

// =====================================================================
// CYTOSCAPE STYLE BUILDER
// =====================================================================
function buildNodeStyle(group) {
  const g = GROUPS[group];
  return { 'background-color': g.color, 'border-color': g.color };
}

function buildStyle(dark) {
  const edgeCol    = dark ? '#3d4f63' : '#94a3b8';
  const edgeLblBg  = dark ? '#1a2231' : '#ffffff';
  const edgeLblCol = dark ? '#6b7280' : '#64748b';

  const groupRules = Object.entries(GROUPS).map(([key, g]) => ({
    selector: `node[group="${key}"]`,
    style: { 'background-color': g.color, 'border-color': g.color },
  }));

  return [
    {
      selector: 'node',
      style: {
        'shape': 'round-rectangle',
        'width': 'label',
        'height': 40,
        'padding': '12px',
        'label': 'data(label)',
        'color': '#ffffff',
        'font-size': 11.5,
        'font-weight': '700',
        'font-family': '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        'text-valign': 'center',
        'text-halign': 'center',
        'text-wrap': 'none',
        'border-width': 2,
        'transition-property': 'opacity, border-width',
        'transition-duration': '180ms',
      },
    },
    ...groupRules,
    {
      selector: 'node.highlighted',
      style: { 'border-width': 4, 'border-color': '#ffffff' },
    },
    {
      selector: 'node.dimmed',
      style: { 'opacity': 0.13 },
    },
    {
      selector: 'edge',
      style: {
        'width': 1.5,
        'line-color': edgeCol,
        'target-arrow-color': edgeCol,
        'target-arrow-shape': 'triangle',
        'curve-style': 'bezier',
        'label': 'data(edgeLbl)',
        'font-size': 9,
        'color': edgeLblCol,
        'text-background-opacity': 0.88,
        'text-background-color': edgeLblBg,
        'text-background-padding': '2px',
        'text-background-shape': 'round-rectangle',
        'edge-text-rotation': 'autorotate',
        'transition-property': 'opacity, line-color, width',
        'transition-duration': '180ms',
      },
    },
    {
      selector: 'edge.highlighted',
      style: {
        'width': 2.5,
        'line-color': '#818cf8',
        'target-arrow-color': '#818cf8',
        'opacity': 1,
        'z-index': 10,
      },
    },
    {
      selector: 'edge.dimmed',
      style: { 'opacity': 0.04 },
    },
  ];
}

// =====================================================================
// BUILD ELEMENTS
// =====================================================================
const cyNodes = Object.entries(ENTITIES).map(([id, d]) => ({
  data: { id, label: d.e + '  ' + id, group: d.g, status: d.s, emoji: d.e },
}));

const cyEdges = RELATIONS.map((r, i) => ({
  data: {
    id: 'e' + i,
    source: r.src,
    target: r.tgt,
    label: r.lbl,
    edgeLbl: r.lbl + '  [' + r.card + ']',
    card: r.card,
  },
}));

// =====================================================================
// INIT CYTOSCAPE
// =====================================================================
let isDark = true;

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: { nodes: cyNodes, edges: cyEdges },
  style: buildStyle(true),
  layout: { name: 'grid' },
  zoom: 1,
  minZoom: 0.15,
  maxZoom: 5,
  wheelSensitivity: 0.3,
});

// =====================================================================
// LAYOUTS
// =====================================================================
const LAYOUTS = ['cose', 'breadthfirst', 'circle'];
let layoutIdx = 0;

function runLayout(animated = true) {
  const name = LAYOUTS[layoutIdx];
  const opts = {
    cose: {
      name: 'cose',
      animate: animated,
      animationDuration: 900,
      fit: true, padding: 70,
      nodeRepulsion: () => 9000,
      nodeOverlap: 30,
      idealEdgeLength: () => 130,
      edgeElasticity: () => 80,
      gravity: 0.07,
      numIter: 1200,
      coolingFactor: 0.99,
      randomize: false,
      initialTemp: 250,
    },
    breadthfirst: {
      name: 'breadthfirst',
      animate: animated,
      animationDuration: 700,
      fit: true, padding: 70,
      directed: true,
      roots: '#JUGADOR, #RECORRIDO',
      spacingFactor: 1.3,
    },
    circle: {
      name: 'circle',
      animate: animated,
      animationDuration: 600,
      fit: true, padding: 70,
      spacingFactor: 1.2,
    },
  };
  cy.layout(opts[name] || opts['cose']).run();
}

function cycleLayout() {
  layoutIdx = (layoutIdx + 1) % LAYOUTS.length;
  const labels = { cose: '⚙ Cose', breadthfirst: '⚙ Árbol', circle: '⚙ Círculo' };
  document.getElementById('layout-btn').textContent = labels[LAYOUTS[layoutIdx]];
  runLayout(true);
}

// hide loading on first layout stop
cy.one('layoutstop', () => {
  const el = document.getElementById('loading');
  el.classList.add('fade');
  setTimeout(() => el.style.display = 'none', 550);
});
runLayout(true);

// =====================================================================
// SELECTION / HIGHLIGHTING
// =====================================================================
let selectedId = null;

function highlightNode(node) {
  selectedId = node.id();
  const hood = node.closedNeighborhood();
  cy.elements().addClass('dimmed').removeClass('highlighted');
  hood.removeClass('dimmed').addClass('highlighted');
  showDetail(node.id());
}

function clearSelection() {
  selectedId = null;
  cy.elements().removeClass('dimmed highlighted');
  closeDetail();
}

cy.on('tap', 'node', e => {
  const id = e.target.id();
  if (selectedId === id) clearSelection();
  else highlightNode(e.target);
});

cy.on('tap', e => {
  if (e.target === cy) clearSelection();
});

// =====================================================================
// TOOLTIP
// =====================================================================
const tooltip = document.getElementById('tooltip');

cy.on('mouseover', 'node', e => {
  const d = ENTITIES[e.target.id()];
  if (!d) return;
  tooltip.innerHTML = `<strong>${e.target.id()}</strong><br><span style="color:var(--text-muted)">${GROUPS[d.g].emoji} ${GROUPS[d.g].label} · ${d.f.length} campos</span>`;
  tooltip.classList.add('show');
});
cy.on('mousemove', 'node', e => {
  tooltip.style.left = (e.originalEvent.clientX + 14) + 'px';
  tooltip.style.top  = (e.originalEvent.clientY + 14) + 'px';
});
cy.on('mouseout', 'node', () => tooltip.classList.remove('show'));

// =====================================================================
// DETAIL PANEL
// =====================================================================
function showDetail(id) {
  const d = ENTITIES[id];
  if (!d) return;
  const g  = GROUPS[d.g];
  const outRels = RELATIONS.filter(r => r.src === id);
  const inRels  = RELATIONS.filter(r => r.tgt === id);

  document.getElementById('detail-panel').style.setProperty('--panel-accent', g.color);

  const fieldsHtml = d.f.map(([type, name]) =>
    `<tr><td>${type}</td><td>${name}</td></tr>`
  ).join('');

  const relChip = (r, otherId, arrow) => {
    const od = ENTITIES[otherId];
    return `
      <div class="rel-chip" onclick="jumpTo('${otherId}')">
        <span class="rel-chip-emo">${od?.e || '?'}</span>
        <div class="rel-chip-body">
          <div class="rel-chip-name">${otherId}</div>
          <div class="rel-chip-label">${arrow} ${r.lbl}</div>
        </div>
        <span class="rel-chip-card">${r.card}</span>
      </div>`;
  };

  const outHtml = outRels.length
    ? outRels.map(r => relChip(r, r.tgt, '→')).join('')
    : '<span style="font-size:.75rem;color:var(--text-muted)">Sin relaciones salientes</span>';

  const inHtml = inRels.length
    ? inRels.map(r => relChip(r, r.src, '←')).join('')
    : '<span style="font-size:.75rem;color:var(--text-muted)">Sin relaciones entrantes</span>';

  const statusLabel = d.s === 'ok' ? '✓ Completo' : '~ Parcial';
  const statusClass = d.s === 'ok' ? 'badge-ok' : 'badge-partial';

  document.getElementById('detail-inner').innerHTML = `
    <div class="detail-head">
      <div class="detail-emo">${d.e}</div>
      <div class="detail-meta">
        <h2>${id}</h2>
        <div class="detail-badges">
          <span class="badge badge-group" style="border-color:${g.color};color:${g.color};background:${g.bg}">${g.emoji} ${g.label}</span>
          <span class="badge ${statusClass}">${statusLabel}</span>
        </div>
      </div>
      <button class="detail-close-btn" onclick="clearSelection()" title="Cerrar (Esc)">✕</button>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Campos</div>
      <table class="fields-list">${fieldsHtml}</table>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Relaciona hacia ↗ (${outRels.length})</div>
      <div class="rel-list">${outHtml}</div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Referenciado desde ↙ (${inRels.length})</div>
      <div class="rel-list">${inHtml}</div>
    </div>
  `;

  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('float-legend').classList.add('shifted');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('float-legend').classList.remove('shifted');
}

function jumpTo(id) {
  const node = cy.getElementById(id);
  if (!node || !node.length) return;
  highlightNode(node);
  cy.animate({ fit: { eles: node.closedNeighborhood(), padding: 100 }, duration: 400, easing: 'ease-out' });
}

// =====================================================================
// FILTER PILLS
// =====================================================================
const activeGroups = new Set(Object.keys(GROUPS));

const filterBar = document.getElementById('filter-bar');
Object.entries(GROUPS).forEach(([key, g]) => {
  const count = Object.values(ENTITIES).filter(e => e.g === key).length;
  const btn = document.createElement('button');
  btn.className = 'filter-pill';
  btn.dataset.group = key;
  btn.style.cssText = `color:${g.color};border-color:${g.color};background:${g.bg}`;
  btn.innerHTML = `${g.emoji} ${g.label} <span class="pill-count">${count}</span>`;
  btn.onclick = () => {
    if (activeGroups.has(key)) {
      activeGroups.delete(key);
      btn.classList.add('off');
      cy.nodes(`[group="${key}"]`).style('display', 'none');
      refreshEdgeVisibility();
    } else {
      activeGroups.add(key);
      btn.classList.remove('off');
      cy.nodes(`[group="${key}"]`).style('display', 'element');
      refreshEdgeVisibility();
    }
    cy.fit(70);
  };
  filterBar.insertBefore(btn, document.getElementById('stats-chip').previousSibling || null);
  filterBar.insertBefore(btn, document.querySelector('.filter-sep'));
});

function refreshEdgeVisibility() {
  cy.edges().forEach(e => {
    const srcOk = activeGroups.has(ENTITIES[e.data('source')]?.g);
    const tgtOk = activeGroups.has(ENTITIES[e.data('target')]?.g);
    e.style('display', srcOk && tgtOk ? 'element' : 'none');
  });
}

// stats
document.getElementById('stats-chip').innerHTML =
  `<strong>${Object.keys(ENTITIES).length}</strong> entidades · <strong>${RELATIONS.length}</strong> relaciones`;

// =====================================================================
// LEGEND
// =====================================================================
document.getElementById('float-legend').innerHTML =
  `<div class="legend-title">Grupos</div>` +
  Object.entries(GROUPS).map(([, g]) =>
    `<div class="legend-item"><div class="legend-dot" style="background:${g.color}"></div><span>${g.emoji} ${g.label}</span></div>`
  ).join('');

// =====================================================================
// SEARCH
// =====================================================================
document.getElementById('search-input').addEventListener('input', function () {
  const q = this.value.trim().toLowerCase();
  if (!q) { clearSelection(); return; }

  const matches = cy.nodes().filter(n => n.id().toLowerCase().includes(q));
  if (!matches.length) {
    cy.elements().removeClass('dimmed highlighted');
    return;
  }
  cy.elements().addClass('dimmed').removeClass('highlighted');
  matches.removeClass('dimmed').addClass('highlighted');
  if (matches.length === 1) {
    jumpTo(matches[0].id());
  }
});

// =====================================================================
// THEME
// =====================================================================
function toggleTheme() {
  isDark = !isDark;
  document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
  document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
  cy.style(buildStyle(isDark)).update();
}

// =====================================================================
// EXPORT
// =====================================================================
function exportPNG() {
  const png = cy.png({ scale: 2.5, bg: isDark ? '#0d1117' : '#f0f4f8', full: true });
  const a = document.createElement('a');
  a.href = png; a.download = 'mer-evidente.png'; a.click();
}

// =====================================================================
// KEYBOARD
// =====================================================================
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (k === 'Escape') clearSelection();
  if (k === 'f' || k === 'F') cy.fit(70);
  if (k === 'r' || k === 'R') runLayout(true);
  if (k === 'l' || k === 'L') cycleLayout();
  if (k === '+' || k === '=') cy.zoom(cy.zoom() * 1.2);
  if (k === '-') cy.zoom(cy.zoom() * 0.8);
});
</script>
</body>
</html>
